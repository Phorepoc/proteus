# package.conf -- how the pdk's package.yml builds this repository's SIS file (release.yml): the ARM handler with the dynarmic
# JIT (cpuhandler_arm.exe) and the image broker (proteusimg.exe), for a PC image built without this layer
NAME=proteus
ARCHES="x32"
IMAGE=ghcr.io/phorepoc/web                # cmake for dynarmic (recipes/prebuild.sh)
REPOS_x32="cxxrt"                         # the JIT links cxxrt's libstdc++ / libphcompat / libgcc
COMPONENTS_x32="cpuhandler_arm proteusimg"
ADDON=0                                   # a board takes the layer itself (PHOREPOC_ADAPTATIONS), not an add-on archive
